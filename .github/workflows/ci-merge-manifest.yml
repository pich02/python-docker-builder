name: CI - merge docker image manifest

on:
  workflow_call:
    inputs:
      branch:
        description: 'The branch to build'
        required: true
        type: string
      tag:
        description: 'docker tag to push'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      branch:
        description: 'The branch to build'
        required: true
        type: string
      tag:
        description: 'docker tag to push'
        required: true
        type: string


permissions:
  contents: read


jobs:
  merge-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Collect Workflow Telemetry
        if: ${{ !env.ACT }}
        uses: catchpoint/workflow-telemetry-action@v2
        with:
          comment_on_pr: false

      - uses: actions/checkout@v4
        if: ${{ !env.ACT }}
        with:
          repository: pich02/python-docker-builder
          fetch-depth: 0
          ref: ${{ inputs.branch }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: "linux/amd64,linux/arm/v7,linux/arm64"
          cache-image: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: "linux/amd64,linux/arm/v7,linux/arm64"
          cache-binary: true

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: "create docker manifest"
        run: |
          docker buildx imagetools create -t pich02/python3-glibc2.24:${{ inputs.tag }} pich02/python3-glibc2.24:${{ inputs.tag }}-amd64 pich02/python3-glibc2.24:${{ inputs.tag }}-armv7l pich02/python3-glibc2.24:${{ inputs.tag }}-arm64;
