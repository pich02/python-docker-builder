name: CD - Build and release Opticharge binary

on:
  push:
    branches: [ "python3*" ]
  workflow_dispatch:
    inputs:
      branch:
        description: 'The branch to build'
        required: true

permissions:
  contents: write
  actions: write


jobs:
  build-python:
    name: Build python multi arch
    uses: ./.github/workflows/ci-build-and-push.yml
    secrets: inherit
    with:
      branch: ${{ inputs.branch }}
      python_version: 3.13.7
      tag: 3.13.7
      dockerfile: ./python-build.dockerfile

  build-scip:
    name: Build python multi arch
    needs: [ build-python ]
    uses: ./.github/workflows/ci-build-and-push.yml
    secrets: inherit
    with:
      branch: ${{ inputs.branch }}
      python_version: 3.13.7
      tag: 3.13.7-scip
      dockerfile: ./python-scip.dockerfile
