name: CD - Build and release Opticharge binary

on:
  push:
    branches: [ "python3*" ]
  workflow_dispatch:
    inputs:
      branch:
        description: 'The branch to build'
        required: true

permissions:
  contents: write
  actions: write

env:
  PYTHON_VERSION: "3.13.7"

jobs:
  build-multi-arch:
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-build-${{ matrix.arch }}
      cancel-in-progress: true
    name: build image
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: "linux/amd64"
            arch: "x86_64"
          - platform: "linux/arm/v7"
            arch: "armv7l"
          - platform: "linux/arm64"
            arch: "arm64"
    steps:
      - name: Collect Workflow Telemetry
        if: ${{ !env.ACT }}
        uses: catchpoint/workflow-telemetry-action@v2
        with:
          comment_on_pr: false

      - uses: actions/checkout@v4
        if: ${{ !env.ACT }}
        with:
          repository: pich02/python-docker-builder
          fetch-depth: 0
          ref: ${{ inputs.branch }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ matrix.platform }}
          cache-image: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: ${{ matrix.platform }}
          cache-binary: true

      - name: Cache var-cache-apt
        id: cache-var-cache-apt
        uses: actions/cache@v4
        with:
          path: var-cache-apt
          key: var-cache-apt-${{ hashFiles('./python-build.dockerfile') }}

      - name: Cache var-lib-apt
        id: cache-var-lib-apt
        uses: actions/cache@v4
        with:
          path: var-lib-apt
          key: var-lib-apt-${{ hashFiles('./python-build.dockerfile') }}

      - name: inject var-cache-apt into docker
        uses: reproducible-containers/buildkit-cache-dance@v2.1.4
        with:
          cache-source: var-cache-apt
          cache-target: /var/cache/apt
          skip-extraction: ${{ steps.cache-var-cache-apt.outputs.cache-hit }}

      - name: inject var-lib-apt into docker
        uses: reproducible-containers/buildkit-cache-dance@v2.1.4
        with:
          cache-source: var-lib-apt
          cache-target: /var/lib/apt
          skip-extraction: ${{ steps.cache-var-lib-apt.outputs.cache-hit }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: python3-glibc2.24:${PYTHON_VERSION}-${{ matrix.arch }}
          platforms: ${{ matrix.platform }}
          context: .
          no-cache: true
          file: ./python-build.dockerfile

  create-manifest:
    needs: [ build-multi-arch ]
    runs-on: ubuntu-latest
    steps:
      - name: Collect Workflow Telemetry
        if: ${{ !env.ACT }}
        uses: catchpoint/workflow-telemetry-action@v2
        with:
          comment_on_pr: false

      - uses: actions/checkout@v4
        if: ${{ !env.ACT }}
        with:
          repository: pich02/python-docker-builder
          fetch-depth: 0
          ref: ${{ inputs.branch }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ matrix.platform }}
          cache-image: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: "linux/amd64,linux/arm/v7,linux/arm64"
          cache-binary: true

      - name: "create docker manifest"
        run: |
          docker manifest create python3-glibc2.24:${PYTHON_VERSION} \
            python3-glibc2.24:${PYTHON_VERSION}-amd64 \
            python3-glibc2.24:${PYTHON_VERSION}-armv7l \
            python3-glibc2.24:${PYTHON_VERSION}-arm64;
          docker manifest push python3-glibc2.24:${PYTHON_VERSION}
